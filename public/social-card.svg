  <defs>
    <linearGradient id="surface" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f2e8" />
      <stop offset="100%" stop-color="#ece4d5" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#surface)" />
  <rect x="38" y="38" width="1124" height="554" rx="24" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="2" />

  <g transform="translate(116 131)">
    <rect width="300" height="368" rx="16" fill="#f7f2e8" stroke="#111111" stroke-width="18" />
    <path d="M44 60 V22 H82 M218 22 H256 V60 M256 308 V346 H218 M82 346 H44 V308" fill="none" stroke="#111111" stroke-width="16" stroke-linecap="square" opacity="0.55" />
    <rect x="78" y="56" width="144" height="176" fill="#f7f2e8" stroke="#111111" stroke-width="16" />
