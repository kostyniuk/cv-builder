    <rect x="100" y="120" width="18" height="18" fill="#1f47e6" />
    <rect x="100" y="156" width="100" height="8" fill="#111111" />
    <rect x="100" y="178" width="100" height="8" fill="#111111" />
    <rect x="100" y="200" width="74" height="8" fill="#111111" />
    <rect x="100" y="236" width="46" height="8" fill="#111111" />
